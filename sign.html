<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN-IN</title>
    <!-- <link rel="stylesheet" href="sign.css"> -->
     <style>
        *{
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}
body{
    background-color: black;
}
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:black;
    position:sticky;
    top:0;
    z-index:100;
}

header nav{
    display:flex;
    align-items:center;
    gap:25px;
}

header nav a{
    text-decoration:none;
    color:white;
}

header nav i{
    color:white;
    font-size:20px;
    cursor:pointer;
    margin-left:0;
}

section{
    display: flex;
    justify-content: center;
}
section div{
        background-color: hsl(0, 0%, 11.5%);
}
.form{
    width: 400px;
    padding: 20px;
    padding-top: 2px;
    background-color: hsl(0, 0%, 11.5%);
    height: 550px;
    margin-top: 30px;
}
.login{
    text-decoration: none;
}
form,.sign,p,input{
    background-color: hsl(0, 0%, 11.5%);
    border: none;
}

form{
    height: 450px;
    padding-right: 3px;
}

input{
    width: 390px;
    height: 45px;
    border: 2px solid grey;
    color: white;

}

.signup{
    width: 395px;
    margin-left: 2px;
    height: 45px;
    background-color: red;
    font-size: medium;
    border-radius: 5px;
}

button{
    width: 100px;
    height: 40px;
    background-color: red;
    margin: 10px;
    cursor: pointer;
    font-size: medium;
    border: none;
    
}
     </style>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>

<body>
    <header>
        <a href="index.html" style="color:white;text-decoration: none;"><h1 >Tech Shop</h1></a>
        <nav>
            <i class="fa-solid fa-magnifying-glass"></i>
            <a href="cart.html"><i class="fa-solid fa-cart-arrow-down"></i></a>

            
                <i class="fa-solid fa-user"></i>
                
        </nav>

    </header> 

    <section>
        <div class="form">
        
        
            <form>
                <h1 class="sign">Signup</h1>
                <p style="font:medium;">Already have an account ? <a href="" class="login">Login</a></p>
                <input type="text" placeholder=" Username"><br><br>
                <input type="email" placeholder=" Email"><br><br>
                <input type="password" placeholder=" Password"><br><br>
                <input type="password" placeholder=" Confirm Password"><br><br>
                <button class="signup">Signup</button>
                
                <center>
                    <div><p style="font:medium;">or login with</p>
                    
                <button style="background-color: blue;">Facebook</button>
                <button>Google</button>
                <button style="background-color: deepskyblue;">Twitter</button></div>
            </center>
            </form>
        
            
        </div>
    </section>
    </body>
    </html>
